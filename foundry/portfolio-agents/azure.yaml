# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.35.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.18'

# The Foundry project (foundry-portfoliomanagement / proj-portfoliomanagement) already exists and
# its only model deployment is gpt-6-luna, so no ai-project service is declared here.
# Toolboxes and the Outlook connection are created by ..\deploytofoundryhosted.ps1.
name: portfolio-agents
services:
  investor-agent:
    host: azure.ai.agent
    project: investor-agent
    language: python
    kind: hosted
    name: InvestorAgent-20261108
    description: Investor Agent representing the client
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

  stocktrader-agent:
    host: azure.ai.agent
    project: stocktrader-agent
    language: python
    kind: hosted
    name: StockTraderAgent-20261108
    description: Stock trading agent
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_ENDPOINT: ${TRADER_TOOLBOX_ENDPOINT}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

  portfolio-manager-agent:
    host: azure.ai.agent
    project: portfolio-manager-agent
    language: python
    kind: hosted
    name: PortfolioManagerAgent-20261108
    description: Portfolio manager facilitating the trader and investor agents
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      PYTHONNOUSERSITE: "1"
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      TOOLBOX_ENDPOINT: ${MANAGER_TOOLBOX_ENDPOINT}
      TRADER_AGENT_NAME: StockTraderAgent-20261108
      INVESTOR_AGENT_NAME: InvestorAgent-20261108
      EMAIL_RECIPIENT: ${EMAIL_RECIPIENT}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
